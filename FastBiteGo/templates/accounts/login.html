{% extends "_base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Увійти в акаунт</title>
  <style>
    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #ff6f00;
      box-shadow: 0 0 5px rgba(255, 111, 0, 0.4);
      outline: none;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }

    .form-wrapper {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
    }

    .form-error {
      color: #d32f2f;
      background: #ffe6e6;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #ff6f00;
      color: #fff;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .submit-btn:hover {
      background-color: #e65c00;
    }

    .register-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.95rem;
    }

    .register-link a {
      color: #ff6f00;
      font-weight: bold;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center; color:#ff6f00; margin-bottom: 1.5rem;">🔐 Вхід</h2>

  <form method="post" class="form-wrapper">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="form-error">
        {% for error in form.non_field_errors %}
          <p style="margin:0;">{{ error }}</p>
        {% endfor %}
      </div>
    {% endif %}

    {{ form|crispy }}

    <button type="submit" class="submit-btn">Увійти</button>
  </form>

  <div class="register-link">
    Немає акаунту?
    <a href="{% url 'accounts:register' %}">Зареєструватися</a>
  </div>
</body>
</html>
{% endblock %}
